name: iPhone Duo Stock Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'

permissions:
  contents: read

concurrency:
  group: iphone-duo-stock-monitor
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate monitor
        run: python -m py_compile monitor.py

      - name: Verify pickup and carrier data
        run: |
          python - <<'PY'
          import monitor

          target = "MK1F4LL/A"
          allowed = {
              "R591": "Cumberland Mall",
              "R184": "Perimeter",
              "R006": "Lenox Square",
              "R080": "Avalon",
              "R259": "Mall of Georgia",
          }

          stores = monitor.fetch_location("30060")

          checked = set()
          for store in stores:
              number = store.get("storeNumber")
              if number not in allowed:
                  continue

              checked.add(number)
              info = store.get(
                  "partsAvailability", {}
              ).get(target, {})

              print("STORE:", allowed[number])
              print("PRODUCT:", target)
              print(
                  "PICKUP:",
                  info.get("pickupDisplay", "unknown")
              )
              print(
                  "PRODUCT FIELDS:",
                  sorted(info.keys())
              )

              carrier_fields = {
                  k: v for k, v in info.items()
                  if any(word in k.lower() for word in (
                      "carrier", "activation", "network"
                  ))
                  and isinstance(v, (str, bool, int))
              }

              print("CARRIER DATA:", carrier_fields)
              print("---")

          print("STORES VERIFIED:", sorted(checked))
          print("ALERTS: Disabled until verified")
          PY
