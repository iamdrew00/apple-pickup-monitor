name: Test iPhone Stock Checker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m py_compile monitor.py

      - name: Verify Apple pickup response
        run: |
          python - <<'PY'
          import monitor
          available, seen_stores = monitor.check()
          print("Filtered store IDs:", sorted(seen_stores))
          print("Matching availability:", available)
          PY
