
name: iPhone Duo Stock Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'

permissions:
  contents: read

concurrency:
  group: iphone-duo-stock-monitor
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate monitor
        run: python -m py_compile monitor.py

      - name: Restore previous stock state
        uses: actions/cache/restore@v4
        with:
          path: .stock-state.json
          key: stock-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-state-

      - name: Check inventory and send alerts
        env:
          NTFY_TOPIC: iPhoneDuoStock
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          import monitor

          TARGET = "MK1F4LL/A"
          STORES = {
              "R591": "Cumberland Mall",
              "R184": "Perimeter",
              "R006": "Lenox Square",
              "R080": "Avalon",
              "R259": "Mall of Georgia",
          }

          BUY_URL = (
              "https://www.apple.com/shop/buy-iphone/"
              "iphone-duo/7.6-inch-display-256gb-night-sky-att"
          )

          STATE = Path(".stock-state.json")
          previous = set()

          if STATE.exists():
              previous = set(json.loads(
                  STATE.read_text()
              ).get("available", []))

          available, seen = monitor.check()

          if not set(STORES).issubset(seen):
              raise RuntimeError(
                  "Not all five Apple Stores were checked"
              )

          current = {
              store for (store, part) in available
              if store in STORES and part == TARGET
          }

          print("Stores checked:", sorted(seen))
          print("Available now:", sorted(current))

          new_stock = current - previous

          for store in sorted(new_stock):
              name = STORES[store]

              title = "iPhone Duo pickup stock found!"

              message = (
                  "iPhone Duo - Night Sky - 256GB\n"
                  f"Apple Store: {name}\n"
                  "Apple pickup inventory: AVAILABLE\n"
                  "AT&T checkout eligibility: UNVERIFIED\n"
                  "Confirm AT&T and pickup at Apple checkout.\n"
                  f"Order: {BUY_URL}"
              )

              req = urllib.request.Request(
                  "https://ntfy.sh/" +
                  os.environ["NTFY_TOPIC"],
                  data=message.encode("utf-8"),
                  headers={
                      "Title": title,
                      "Priority": "high",
                      "Tags": "iphone",
                      "Click": BUY_URL,
                  },
                  method="POST",
              )

              with urllib.request.urlopen(
                  req, timeout=20
              ) as response:
                  print(
                      "Alert sent:",
                      name,
                      response.status
                  )

          STATE.write_text(json.dumps({
              "available": sorted(current)
          }))

          if not current:
              print("No matching stock. No alert sent.")
          elif not new_stock:
              print("Stock already reported. No duplicate alert.")
          PY

      - name: Save latest stock state
        uses: actions/cache/save@v4
        with:
          path: .stock-state.json
          key: stock-state-${{ github.run_id }}-${{ github.run_attempt }}
