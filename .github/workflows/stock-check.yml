name: Test iPhone Stock Checker

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m py_compile monitor.py

      - name: Verify Apple pickup response
        run: |
          python - <<'PY'
          import monitor

          part = "MK1F4LL/A"
          stores = monitor.fetch_location("30060")
          print("Stores returned:", len(stores))

          recognized = 0
          for store in stores:
              number = store.get("storeNumber")
              name = store.get("storeName")
              info = store.get("partsAvailability", {}).get(part)
              status = info.get("pickupDisplay", "unknown") if info else "unknown"
              if info:
                  recognized += 1
              print(f"{number} | {name} | {status}")

          print("Stores recognizing product:", recognized)
          if recognized == 0:
              raise RuntimeError("Product not recognized in pickup response")
          PY
